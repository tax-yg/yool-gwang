backend:
  name: git-gateway
  branch: main

media_folder: "images/column"
public_folder: "/images/column"

collections:
  - name: "column"
    label: "세무 칼럼"
    folder: "tax-column"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{category}}/{{fields.subcategory}}/{{slug}}"
    path: "{{category}}/{{fields.subcategory}}/{{slug}}/index"

    fields:
      - { label: "제목", name: "title", widget: "string" }
      - label: "1차 카테고리"
        name: "category"
        widget: "select"
        options:
          - { label: "양도소득세", value: "capital-gains-tax" }
          - { label: "상속세", value: "inheritance-tax" }
          - { label: "증여세", value: "gift-tax" }
          - { label: "사업자 세무", value: "business-tax" }
      - { label: "2차 카테고리(세부 주제)", name: "subcategory", widget: "string", required: false }
      - { label: "요약(meta description)", name: "description", widget: "text" }
      - { label: "발행일", name: "date", widget: "datetime" }
      - label: "자주 묻는 질문(FAQ)"
        name: "faq"
        label_singular: "질문"
        widget: "list"
        required: false
        summary: "{{fields.question}}"
        fields:
          - { label: "질문", name: "question", widget: "string" }
          - { label: "답변", name: "answer", widget: "text" }
      - { label: "본문", name: "body", widget: "markdown" }
